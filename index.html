<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Métricas equipo de ventas</title>
<style>
  :root {
    --bg: #ffffff;
    --card: #ffffff;
    --border: #e9e9eb;
    --shadow: 0 1px 2px rgba(15, 15, 20, .04);
    --text: #3a3d44;
    --muted: #8b8f98;
    --track: #eeeff1;
    --red: #d64545;
    --amber: #d38b0b;
    --green: #1f9d55;
    --neutral: #3a3d44;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #191919; --card: #232323; --border: #2f2f2f; --shadow: none;
      --text: #e6e6e6; --muted: #9b9b9b; --track: #333;
      --red: #ef6b6b; --amber: #f0b03d; --green: #4cc38a; --neutral: #e6e6e6;
    }
  }
  :root[data-theme="dark"] {
    --bg: #191919; --card: #232323; --border: #2f2f2f; --shadow: none;
    --text: #e6e6e6; --muted: #9b9b9b; --track: #333;
    --red: #ef6b6b; --amber: #f0b03d; --green: #4cc38a; --neutral: #e6e6e6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; }
  body { padding: 4px 2px 8px; }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 0 2px 10px; flex-wrap: wrap; }
  .section { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .stamp { font-size: 12px; color: var(--muted); }
  .demo { display: none; font-size: 12px; color: var(--amber); font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow);
    padding: 16px 18px 14px; min-width: 0; }
  .title { font-size: 16px; font-weight: 600; margin: 0; }
  .sub { font-size: 13px; color: var(--muted); margin: 2px 0 6px; }
  .card { container-type: inline-size; }
  /* El número se adapta al ancho de la tarjeta para no salirse nunca */
  .num { font-size: min(44px, 27cqi); font-weight: 600; line-height: 1.05; letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .num.long { font-size: min(32px, 20cqi); }
  .num.xlong { font-size: min(26px, 13cqi); }
  .num small { font-size: .55em; font-weight: 600; margin-left: 1px; }
  .num .of { font-size: .5em; color: var(--muted); font-weight: 500; margin-left: 4px; }
  .foot { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
  .bar { position: relative; height: 6px; background: var(--track); border-radius: 99px; margin-top: 10px; overflow: visible; }
  .bar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: currentColor; transition: width .6s ease; }
  .bar .mark { position: absolute; top: -4px; width: 2px; height: 14px; background: var(--muted); border-radius: 1px; }
  .red { color: var(--red); } .amber { color: var(--amber); } .green { color: var(--green); } .neutral { color: var(--neutral); }
  .err { font-size: 13px; color: var(--red); padding: 8px 2px; }
  /* ---- Panel CEO ---- */
  :root { --s1: #2a78d6; --s0: #c9c8c2; --grid: #ececea; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --s1: #3987e5; --s0: #4b4a46; --grid: #2c2c2c; } }
  :root[data-theme="dark"] { --s1: #3987e5; --s0: #4b4a46; --grid: #2c2c2c; }
  body.ceo .std { display: none; }
  .chart { background: var(--card); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); padding: 14px 16px 10px; margin-bottom: 18px; }
  .chart svg { width: 100%; height: auto; display: block; overflow: visible; }
  .chart .ax { font-size: 11px; fill: var(--muted); }
  .chart .gl { stroke: var(--grid); stroke-width: 1; }
  .legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); margin: 2px 0 6px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .flow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 6px; margin-bottom: 18px; }
  .stage { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; min-width: 96px; flex: 1 1 96px; }
  .stage b { display: block; font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stage span { font-size: 12.5px; color: var(--muted); }
  .step { display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 12px; color: var(--muted); min-width: 46px; font-variant-numeric: tabular-nums; }
  .step b { font-size: 13px; font-weight: 600; }
  .note { font-size: 12px; color: var(--muted); margin: -10px 2px 18px; }
</style>
</head>
<body>
  <div class="top">
    <span class="section" id="weekTitle">Objetivo de la semana</span>
    <span><span class="demo" id="demo">Datos de ejemplo · falta conectar Notion · </span><span class="stamp" id="stamp">Cargando datos del CRM…</span></span>
  </div>
  <div class="grid std" id="gridWeek"></div>
  <div class="top std"><span class="section" id="monthTitle">Objetivo del mes</span></div>
  <div class="grid std" id="gridMonth"></div>
  <div id="ratiosBlock" class="std"><div class="top"><span class="section">Ratios</span></div>
  <div class="grid" id="gridRatios"></div></div>
  <div id="setters" class="std"></div>
  <div id="closers" class="std"></div>
  <div id="ceo"></div>
  <div class="err" id="err" hidden></div>

<script>
const MONTHS = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const fmtPct = (n, d) => d ? (n / d * 100) : null;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function pctCard(title, sub, num, den, foot, target, bandas) {
  const v = fmtPct(num, den);
  const txt = v === null ? "—" : v >= 99.995 ? "100" : v.toFixed(2).replace(".", ",");
  // bandas (opcional): { verde: X, ambar: Y } → ≥X verde · entre Y y X ámbar · <Y rojo
  const cls = v === null ? "neutral"
    : bandas ? (v >= bandas.verde ? "green" : v >= bandas.ambar ? "amber" : "red")
    : !target ? "neutral" : v >= target ? "green" : v > target * 0.7 ? "amber" : "red";
  const ref = bandas ? " · bueno ≥" + bandas.verde + "%" : target ? " · objetivo " + target + "%" : "";
  return `<div class="card"><p class="title">${esc(title)}</p><p class="sub">${esc(sub)}${ref}</p>
    <div class="num ${cls}${txt.length > 5 ? " long" : ""}">${txt}${v === null ? "" : "<small>%</small>"}</div><div class="foot">${esc(foot)}</div></div>`;
}

function miles(n) { return (n === null || n === undefined || isNaN(n)) ? n : Number(n).toLocaleString("de-DE"); }

function goalCard(title, actual, goal, ritmo, goalMax, nota) {
  if (!goal) {
    return `<div class="card"><p class="title">${esc(title)}</p><p class="sub">Sin objetivo definido</p>
      <div class="num neutral">${miles(actual)}</div><div class="foot">Escríbelo en la página del mes (CRM MENSUAL)</div></div>`;
  }
  const expected = ritmo.total ? goal * ritmo.elapsed / ritmo.total : 0;
  // Semáforo
  //  · SEMANA: % conseguido del objetivo semanal → ≤70% rojo · 70–99% ámbar · ≥100% verde
  //  · MES: lo que llevamos frente a lo que deberíamos llevar a estas alturas (mismos cortes)
  const semanal = !!ritmo.startLabel;
  const logro = actual / goal;
  const pctTxt = Math.round(logro * 100) + "% del objetivo";
  const color = r => r >= 1 ? "green" : r > 0.7 ? "amber" : "red";
  let cls, foot;
  if (actual >= goal) { cls = "green"; foot = "¡Objetivo conseguido! · " + pctTxt; }
  else if (semanal) {
    cls = color(logro);
    foot = pctTxt + " · faltan " + miles(goal - actual);
  } else if (ritmo.elapsed === 0 || expected <= 0) {
    cls = color(logro);
    foot = pctTxt + " · Arrancando el mes";
  } else {
    cls = color(actual / expected);
    const diff = Math.round(actual - expected);
    foot = `A estas alturas: ${miles(Math.round(expected))} · ` + (diff >= 0 ? `vas +${miles(diff)}` : `faltan ${miles(-diff)}`) + " · " + pctTxt;
  }
  const fillW = Math.min(100, actual / goal * 100);
  const markL = Math.min(100, expected / goal * 100);
  return `<div class="card"><p class="title">${esc(title)}</p><p class="sub">Objetivo: ${miles(goal)}${goalMax ? "–" + miles(goalMax) : ""}${nota ? " · " + nota : ""}</p>
    <div class="num ${cls}${(String(actual) + String(goal)).length > 10 ? " long xlong" : (String(actual) + String(goal)).length > 6 ? " long" : ""}">${miles(actual)}<span class="of">/ ${miles(goal)}</span></div>
    <div class="bar ${cls}"><div class="fill" style="width:${fillW}%"></div>${(ritmo.elapsed && !semanal) ? `<div class="mark" style="left:calc(${markL}% - 1px)" title="Ritmo esperado"></div>` : ""}</div>
    <div class="foot">${esc(foot)}</div></div>`;
}

function salesCard(title, s) {
  const pct = s.ventas ? Math.round(s.unico / s.ventas * 100) : 0;
  const extra = s.sinRegistrar ? ` · ${s.sinRegistrar} sin pago registrado` : "";
  return `<div class="card"><p class="title">${esc(title)}</p><p class="sub">Ventas cerradas</p>
    <div class="num neutral">${s.ventas}</div>
    <div class="foot">${s.unico} a pago único (${pct}%)${esc(extra)}</div></div>`;
}

function fmtRange(a, b) {
  const M = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  const f = s => Number(s.slice(8, 10)) + " " + M[Number(s.slice(5, 7)) - 1];
  return f(a) + " – " + f(b);
}

function numCard(title, sub, value, foot) {
  return '<div class="card"><p class="title">' + esc(title) + '</p><p class="sub">' + esc(sub) + '</p><div class="num neutral' + (String(value).length > 8 ? ' long xlong' : String(value).length > 5 ? ' long' : '') + '">' + value + '</div><div class="foot">' + esc(foot) + '</div></div>';
}

function render(data) {
  const p = data.periods;
  // Mes de negocio (semanas L-D en el mes de su miércoles); si no viene, mes natural
  const mIdx = (data.mes && data.mes.m ? data.mes.m : Number(data.today.slice(5, 7))) - 1;
  const mName = MONTHS[mIdx];
  document.getElementById("monthTitle").textContent = `Objetivo de ${mName}`;
  document.getElementById("demo").style.display = data.demo ? "inline" : "none";
  const t = new Date(data.updatedAt);
  document.getElementById("stamp").textContent = "Actualizado " +
    t.toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Madrid" });

  if (VISTA === "ceo") { renderCEO(data, mName); return; }
  const obj = data.objetivo || {};
  document.getElementById("gridMonth").innerHTML =
    goalCard("Entrevistas agendadas", p.month.agendadasTotal != null ? p.month.agendadasTotal : p.month.agendadas, obj.agendadas, data.ritmo) +
    goalCard("Llamadas realizadas", p.month.asistidas, obj.realizadasMin, data.ritmo, obj.realizadasMax) +
    goalCard("Cierres", p.month.ventas, obj.cierresMin, data.ritmo, obj.cierresMax) +
    salesCard(`Ventas ${mName}`, p.month) +
    salesCard(`Ventas ${data.today.slice(0, 4)}`, p.year);

  const w = data.semana, ow = data.objetivoSemana;
  if (w) {
    document.getElementById("weekTitle").textContent = "Objetivo de la semana · " + fmtRange(w.desde, w.hasta);
    document.getElementById("gridWeek").innerHTML = ow ?
      goalCard("Llamadas agendadas", w.agendadasTotal, ow.agendadas, data.ritmoSemana) +
      goalCard("Llamadas realizadas", w.asistidas, ow.realizadasMin, data.ritmoSemana, ow.realizadasMax) +
      goalCard("Cierres", w.ventas, ow.cierresMin, data.ritmoSemana, ow.cierresMax)
      : '<div class="card"><p class="title">Sin objetivo semanal</p><p class="sub">Escríbelo en la reunión del equipo de ventas</p></div>';
  }

  document.getElementById("gridRatios").innerHTML =
    pctCard("Asistencia", "Últimos 30 días", p.d30.asistidas, p.d30.agendadas, `${p.d30.asistidas} de ${p.d30.agendadas} agendadas`, obj.showup) +
    pctCard("Asistencia", "Este año", p.year.asistidas, p.year.agendadas, `${p.year.asistidas} de ${p.year.agendadas} agendadas`, obj.showup) +
    pctCard("Cierre", "Últimos 30 días", p.d30.ventas, p.d30.asistidas, `${p.d30.ventas} ventas de ${p.d30.asistidas} llamadas`, obj.cierrePctMin) +
    pctCard("Cierre", `Este trimestre (T${data.quarter})`, p.quarter.ventas, p.quarter.asistidas, `${p.quarter.ventas} ventas de ${p.quarter.asistidas} llamadas`, obj.cierrePctMin) +
    pctCard("Cierre", "Este año", p.year.ventas, p.year.asistidas, `${p.year.ventas} ventas de ${p.year.asistidas} llamadas`, obj.cierrePctMin);
  const tq = "Este trimestre (T" + data.quarter + ")";
  document.getElementById("closers").innerHTML = (data.closers || []).map(function (c) {
    const q = c.periods;
    return '<div class="top"><span class="section">Métricas de ' + esc(c.nombre) + '</span></div><div class="grid">' +
      numCard("Llamadas realizadas", "Este mes", q.month.asistidas, q.month.agendadas + " agendadas") +
      salesCard("Ventas " + mName, q.month) +
      pctCard("Cierre", "Últimos 30 días", q.d30.ventas, q.d30.asistidas, q.d30.ventas + " ventas de " + q.d30.asistidas + " llamadas", obj.cierrePctMin) +
      pctCard("Cierre", tq, q.quarter.ventas, q.quarter.asistidas, q.quarter.ventas + " ventas de " + q.quarter.asistidas + " llamadas", obj.cierrePctMin) +
      pctCard("Cierre", "Este año", q.year.ventas, q.year.asistidas, q.year.ventas + " ventas de " + q.year.asistidas + " llamadas", obj.cierrePctMin) +
      '</div>';
  }).join("");
  const esSetter = VISTA === "setter";
  document.getElementById("ratiosBlock").style.display = esSetter ? "none" : "";
  document.getElementById("closers").style.display = esSetter ? "none" : "";
  const rango = w ? fmtRange(w.desde, w.hasta) : "Esta semana";
  const fmt = n => (n === null || n === undefined) ? "—" : n;
  document.getElementById("setters").innerHTML = !esSetter ? "" : (data.setters || []).map(function (s) {
    const fila = (titulo, per, sub, semanal) => '<div class="top"><span class="section">' + titulo + '</span></div><div class="grid">' +
      numCard("Propuestas de llamada", sub, fmt(per.propuestas), "Según tabla CRM Mensual") +
      numCard("Llamadas agendadas", sub, per.agendadas, "Con " + s.nombre + " como setter") +
      numCard("Cierres setteados", sub, per.cierres, "Ventas con " + s.nombre + " como setter") +
      pctCard("Respuesta a bienvenida", sub, per.respuestas, per.bienvenidas, per.bienvenidas ? miles(per.respuestas) + " respuestas de " + miles(per.bienvenidas) + " bienvenidas" : "Falta rellenar la tabla CRM Mensual", null, { verde: 20, ambar: 10 }) +
      pctCard("Show up", sub, per.showup ? per.showup.realizadas : 0, per.showup ? per.showup.total : 0, per.showup && per.showup.total ? per.showup.realizadas + " de " + per.showup.total + " llamadas setteadas se presentaron" : "Aún sin llamadas con resultado", (data.objetivo || {}).showup) +
      '</div>';
    return fila("Métricas de " + esc(s.nombre) + " · esta semana", s.semana, rango, true) +
           fila("Métricas de " + esc(s.nombre) + " · " + mName, s.mes, "Acumulado de " + mName, false);
  }).join("");
  // Embudo de llamada (Skalex): HOT LEAD → LAURA → LLAMADA AGENDADA
  if (esSetter) {
    const embudo = (titulo, e, sub) => '<div class="top"><span class="section">' + titulo + '</span></div><div class="grid">' +
      pctCard("Propuesta → Acepta llamada", sub, e.aceptan, e.propuestas, e.propuestas ? e.aceptan + " de " + e.propuestas + " propuestas aceptan (pasan a Laura)" : "Aún sin propuestas", null, { verde: 45, ambar: 30 }) +
      pctCard("Acepta → Agenda llamada", sub, e.aceptanAgendan, e.aceptan, e.aceptan ? e.aceptanAgendan + " de " + e.aceptan + " que aceptaron agendan" : "Aún nadie ha aceptado", null, { verde: 80, ambar: 60 }) +
      pctCard("Propuesta → Agenda llamada", sub, e.agendan, e.propuestas, e.propuestas ? e.agendan + " de " + e.propuestas + " propuestas acaban agendando" : "Aún sin propuestas", null, { verde: 35, ambar: 15 }) +
      '</div>';
    document.getElementById("setters").innerHTML += data.skalex
      ? embudo("Embudo de llamada · esta semana (Skalex)", data.skalex.semana, rango) + embudo("Embudo de llamada · " + mName + " (Skalex)", data.skalex.mes, "Acumulado de " + mName)
      : '<div class="top"><span class="section">Embudo de llamada (Skalex)</span></div><div class="foot" style="margin:0 2px 18px">' + esc(data.skalexError || "Skalex no disponible") + '</div>';
  }
  if (esSetter && data.setters && data.setters[0]) {
    const s0 = data.setters[0], bso = data.bienvenidasSemanaObjetivo;
    document.getElementById("gridMonth").innerHTML += goalCard("Bienvenidas", s0.mes.bienvenidas || 0, obj.bienvenidas, data.ritmo);
  }
}

// ============ PANEL CEO (?vista=ceo) ============
const MES_C = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
const eur = n => (n === null || n === undefined || isNaN(n)) ? "—" : Math.round(n).toLocaleString("de-DE") + " €";
const pctTxt = (a, b) => b ? (a / b * 100).toFixed(1).replace(".", ",") + "%" : "—";
const sec = t => '<div class="top"><span class="section">' + t + '</span></div>';

function barChartCEO(act, prev, ano) {
  const W = 640, H = 210, L = 44, R = 6, T = 8, B = 24;
  const vals = act.concat(prev).filter(v => v != null);
  const max = Math.max.apply(null, vals.concat([1]));
  const step = max > 30000 ? 10000 : 5000, top = Math.ceil(max / step) * step;
  const y = v => T + (H - T - B) * (1 - v / top), slot = (W - L - R) / 12, bw = Math.min(16, slot / 2 - 3);
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Facturación mensual ' + ano + ' frente a ' + (ano - 1) + '">';
  for (let v = 0; v <= top; v += step) s += '<line class="gl" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text class="ax" x="' + (L - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + (v / 1000) + 'k</text>';
  const bar = (x, v, col, lab) => {
    if (v == null) return "";
    const yy = y(v), h = Math.max(0, y(0) - yy), r = Math.min(4, h);
    const d = "M" + x + "," + y(0) + " V" + (yy + r) + " Q" + x + "," + yy + " " + (x + r) + "," + yy + " H" + (x + bw - r) + " Q" + (x + bw) + "," + yy + " " + (x + bw) + "," + (yy + r) + " V" + y(0) + " Z";
    return '<path d="' + d + '" fill="' + col + '"><title>' + lab + ": " + eur(v) + '</title></path>';
  };
  for (let i = 0; i < 12; i++) {
    const cx = L + slot * i + slot / 2;
    s += bar(cx - bw - 1, prev[i], "var(--s0)", MES_C[i] + " " + (ano - 1));
    s += bar(cx + 1, act[i], "var(--s1)", MES_C[i] + " " + ano);
    s += '<text class="ax" x="' + cx + '" y="' + (H - 6) + '" text-anchor="middle">' + MES_C[i] + '</text>';
  }
  return s + '</svg>';
}

function flowCEO(stages) {
  let h = '<div class="flow">';
  stages.forEach((st, i) => {
    if (i > 0) { const pr = stages[i - 1].n; h += '<div class="step"><b>' + pctTxt(st.n, pr) + '</b>→</div>'; }
    h += '<div class="stage"><b>' + (st.n == null ? "—" : Number(st.n).toLocaleString("de-DE")) + '</b><span>' + esc(st.l) + '</span></div>';
  });
  return h + '</div>';
}

function renderCEO(data, mName) {
  document.body.classList.add("ceo");
  document.getElementById("weekTitle").textContent = "Panel CEO · " + mName;
  const c = data.ceo || {}, p = data.periods, obj = data.objetivo || {}, O = c.objetivos || {};
  const d = c.dinero, cl = c.clientas, em = c.embudo || {};
  const bm = (data.mes && data.mes.m) || Number(data.today.slice(5, 7));
  let h = "";
  // 1) Objetivos del año
  let g = "";
  if (d) g += goalCard("Facturación " + d.ano + " (€)", Math.round(d.ytd), O.facturacionAnual, d.ritmoAno);
  if (cl) g += goalCard("Clientas activas", cl.activas, O.clientasActivas, { elapsed: 0, total: 0, startLabel: "Objetivo del año" });
  g += goalCard("Ventas " + mName, p.month.ventas, obj.cierresMin, data.ritmo, obj.cierresMax);
  if (d) {
    const ben = d.meses.reduce((s, x) => s + (x && x.beneficio != null ? x.beneficio : 0), 0);
    g += numCard("Beneficio " + d.ano, "Acumulado del año", eur(ben), "Margen " + pctTxt(ben, d.ytd) + " sobre facturación");
  }
  h += sec("Objetivos " + data.today.slice(0, 4)) + '<div class="grid">' + g + '</div>';
  // 2) Dinero del mes
  if (d) {
    let i = bm - 1; if (!d.meses[i]) { for (i = d.meses.length - 1; i >= 0 && !d.meses[i]; i--); }
    const mm = i >= 0 ? d.meses[i] : null, nm = MONTHS[i] || mName, prevMes = d.mesesAnterior[i];
    const nCon = d.meses.reduce((k, x, j) => x && x.ingresos != null ? j + 1 : k, 0);
    const ytdPrev = d.mesesAnterior.slice(0, nCon).reduce((s, x) => s + (x || 0), 0);
    if (mm) {
      const cac = p.month.ventas ? ((mm.ads || 0) + (mm.captacion || 0)) / p.month.ventas : null;
      h += sec("Dinero · " + nm + " (BALANCE ECONÓMICO)") + '<div class="grid">' +
        numCard("Facturación " + nm, "Mes natural", eur(mm.ingresos), prevMes ? (mm.ingresos >= prevMes ? "+" : "") + pctTxt(mm.ingresos - prevMes, prevMes) + " vs " + nm + " " + (d.ano - 1) + " (" + eur(prevMes) + ")" : "") +
        numCard("Gastos " + nm, "Del negocio", eur(mm.gastos), "") +
        numCard("Beneficio " + nm, "Ingresos − gastos", eur(mm.beneficio), "Margen " + pctTxt(mm.beneficio, mm.ingresos)) +
        numCard("Publicidad " + nm, "Facebook Ads", eur(mm.ads), "Equipo de captación: " + eur(mm.captacion)) +
        numCard("Coste por venta", "Publicidad + captación", eur(cac), p.month.ventas + " ventas en " + mName) +
        '</div>';
    }
    h += sec("Facturación mensual " + d.ano + " vs " + (d.ano - 1)) + '<div class="chart"><div class="legend"><span><i style="background:var(--s1)"></i>' + d.ano + '</span><span><i style="background:var(--s0)"></i>' + (d.ano - 1) + '</span><span>Hasta ' + MONTHS[nCon - 1] + ': ' + eur(d.ytd) + ' vs ' + eur(ytdPrev) + ' (' + (d.ytd >= ytdPrev ? "+" : "") + pctTxt(d.ytd - ytdPrev, ytdPrev) + ')</span></div>' +
      barChartCEO(d.meses.map(x => x ? x.ingresos : null), d.mesesAnterior, d.ano) + '</div>';
  } else if (c.dineroError) h += sec("Dinero") + '<div class="note" style="margin-top:0">No se pudo leer BALANCE ECONÓMICO (' + esc(c.dineroError) + ')</div>';
  // 3) Clientas
  if (cl) {
    const r = cl.renovaciones || {}, neto = cl.altasMes - cl.bajasMes;
    h += sec("Clientas · " + mName) + '<div class="grid">' +
      numCard("Activas ahora", "Estado ALTA en el CRM", cl.activas, "Objetivo: " + (O.clientasActivas || "—")) +
      numCard("Altas", "Acumulado de " + mName, cl.altasMes, "Nuevas clientas") +
      numCard("Bajas", "Acumulado de " + mName, cl.bajasMes, "Con fecha de baja") +
      numCard("Crecimiento neto", "Altas − bajas", (neto > 0 ? "+" : "") + neto, neto >= 0 ? "Crece la base" : "Se reduce la base") +
      (r.encontrado ? pctCard("Renovaciones", r.mes.toLowerCase(), r.renovadas, r.aRenovar, r.renovadas + " de " + r.aRenovar + " renuevan") : "") +
      '</div>';
  }
  // 4) Embudo completo
  h += sec("Embudo de " + mName + " · captación por DM (Skalex)") + flowCEO([
    { l: "Bienvenidas", n: em.bienvenidas }, { l: "Responden", n: em.respuestas }, { l: "Propuesta de llamada", n: em.propuestas },
    { l: "Aceptan", n: em.aceptan }, { l: "Agendan", n: data.skalex && data.skalex.mes ? data.skalex.mes.agendan : null } ]);
  h += sec("Embudo de " + mName + " · llamadas (CRM)") + flowCEO([
    { l: "Entrevistas agendadas", n: em.agendadas }, { l: "Realizadas", n: em.realizadas }, { l: "Ventas", n: em.ventas } ]);
  h += '<div class="note">Las entrevistas del CRM incluyen todas las vías (DM, formularios, inbound), por eso son más que las agendadas desde la propuesta por DM.</div>';
  // 5) Equipo
  const pa = (data.closers || [])[0], la = data.skalex && data.skalex.mes;
  h += sec("Equipo · " + mName) + '<div class="grid">' +
    (pa ? pctCard("Cierre · " + pa.nombre, "Acumulado de " + mName, pa.periods.month.ventas, pa.periods.month.asistidas, pa.periods.month.ventas + " ventas de " + pa.periods.month.asistidas + " llamadas", obj.cierrePctMin) : "") +
    pctCard("Show up", "Acumulado de " + mName, p.month.asistidas, p.month.agendadas, p.month.asistidas + " de " + p.month.agendadas + " se presentaron", obj.showup) +
    pctCard("Respuesta a bienvenida · Laura", "Skalex · " + mName, em.respuestas, em.bienvenidas, (em.respuestas || 0).toLocaleString("de-DE") + " de " + (em.bienvenidas || 0).toLocaleString("de-DE"), null, { verde: 20, ambar: 10 }) +
    (la ? pctCard("Propuesta → Agenda · Laura", "Skalex · " + mName, la.agendan, la.propuestas, la.agendan + " de " + la.propuestas + " propuestas", null, { verde: 35, ambar: 15 }) : "") +
    '</div>';
  const errs = [c.clientasError, c.embudoError, c.embudo && c.embudo.skalexError].filter(Boolean);
  if (errs.length) h += '<div class="note">' + esc(errs.join(" · ")) + '</div>';
  document.getElementById("ceo").innerHTML = h;
}

const API = "https://script.google.com/macros/s/AKfycbxWSdheRFPwOYmyp8M4936GVyqja6qCNxXYe6JKiPp2t9iHZnGIHvNUJgFL9s3IZ5RHXg/exec?format=json";
let VISTA = new URLSearchParams(location.search).get("vista") || "";
function onData(data) { const err = document.getElementById("err"); err.hidden = true; render(data); const avisos = []; if (data.pagosError) avisos.push("Pago único no disponible (" + data.pagosError + ")"); if (data.setterError && VISTA === "setter") avisos.push("Métricas de setter no disponibles (" + data.setterError + ")"); if (data.objetivoSemanaError) avisos.push("Objetivo semanal no disponible (" + data.objetivoSemanaError + ")"); if (data.objetivoError) avisos.push("Objetivos no disponibles (" + data.objetivoError + ")"); if (avisos.length) { err.textContent = avisos.join(" · "); err.hidden = false; } }
function load() {
  const err = document.getElementById("err");
  fetch(API + (VISTA === "ceo" ? "&vista=ceo" : "") + "&t=" + Date.now(), { credentials: "omit", cache: "no-store" })
    .then(r => r.json())
    .then(data => { if (data.error) throw new Error(data.error); onData(data); })
    .catch(e => { err.textContent = "No se pudieron cargar las métricas (" + (e && e.message || e) + "). Reintentando…"; err.hidden = false; });
}
load();
setInterval(load, 5 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
